# =============================================================================
# Nginx — API Gateway / Reverse Proxy
# AI Landing Page Generator
# Requirements: 13.3 (security headers, CSRF), 8.2 (SSL/TLS)
# =============================================================================

# Worker processes — auto-detect CPU cores
worker_processes auto;

# Maximum open file descriptors per worker
worker_rlimit_nofile 65535;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    # ---------------------------------------------------------------------------
    # Basic settings
    # ---------------------------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;  # Hide nginx version from error pages and headers

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    # ---------------------------------------------------------------------------
    # Logging
    # ---------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ---------------------------------------------------------------------------
    # Rate limiting zones
    # General zone: 100 requests/minute per IP (burst of 20)
    # Strict zone for POST /generate: 10 requests/minute per IP (burst of 5)
    # ---------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=general:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=generate:10m rate=10r/m;

    # Return 429 Too Many Requests (instead of default 503) when rate limit hit
    limit_req_status 429;

    # ---------------------------------------------------------------------------
    # Upstream definitions
    # ---------------------------------------------------------------------------
    upstream api_backend {
        server api:8000;
        keepalive 32;
    }

    upstream frontend_backend {
        server frontend:3000;
        keepalive 16;
    }

    # ---------------------------------------------------------------------------
    # HTTP server — serves on port 80
    # In production, replace the proxy blocks with a redirect to HTTPS:
    #   return 301 https://$host$request_uri;
    # ---------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # Security headers (defined in conf.d/security_headers.conf)
        include /etc/nginx/conf.d/security_headers.conf;

        # Health check endpoint (used by Docker / Kubernetes probes)
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Strict rate limit on the generation endpoint (must come before /api/)
        location = /api/generate {
            limit_req zone=generate burst=5 nodelay;

            proxy_pass         http://api_backend/generate;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            # Longer timeout for generation jobs (up to 45s estimated)
            proxy_read_timeout  120s;
            proxy_send_timeout  120s;
            proxy_connect_timeout 10s;
        }

        # API routes — proxy to FastAPI
        location /api/ {
            limit_req zone=general burst=20 nodelay;

            proxy_pass         http://api_backend/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            proxy_read_timeout  120s;
            proxy_send_timeout  120s;
            proxy_connect_timeout 10s;
        }

        # OpenAPI docs (FastAPI built-in — no rate limit needed)
        location ~ ^/(docs|redoc|openapi\.json)$ {
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Frontend — proxy to Nuxt 3 (includes WebSocket upgrade for HMR in dev)
        location / {
            limit_req zone=general burst=20 nodelay;

            proxy_pass         http://frontend_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # WebSocket support (Nuxt HMR in development)
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";

            proxy_read_timeout  60s;
            proxy_send_timeout  60s;
            proxy_connect_timeout 10s;
        }
    }

