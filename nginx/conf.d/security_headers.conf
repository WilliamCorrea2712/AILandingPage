# =============================================================================
# Security Headers — included by all server blocks
# Requirements: 13.3 (CSRF, security headers)
# =============================================================================

# Prevent clickjacking attacks
add_header X-Frame-Options "SAMEORIGIN" always;

# Prevent MIME-type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Enable browser XSS filter (legacy browsers)
add_header X-XSS-Protection "1; mode=block" always;

# HTTP Strict Transport Security — 1 year, include subdomains
# NOTE: Only effective over HTTPS. Uncomment when SSL is enabled in production.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Content Security Policy
# Adjust the policy to match your actual asset sources before going to production.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

# Referrer policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions policy (disable unused browser features)
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
